# Pinned on purpose. The REX verifier compiles to a WASI component, and the
# WASI version it imports depends on the Rust version: 1.86-1.90 import 0.2.3,
# 1.92 imports 0.2.6, 1.98 imports 0.2.9, and 1.100 imports 0.2.12, which the
# DevNet validators cannot instantiate (their log: "component imports instance
# wasi:cli/exit@0.2.12, but a matching implementation was not found"). Do not
# bump this without re-running a live check on devnet.
[toolchain]
channel = "1.90.0"
profile = "minimal"
targets = ["wasm32-wasip2"]
