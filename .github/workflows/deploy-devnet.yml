# Deploys Handshake to Rialo devnet from a Linux runner using persistent keys
# stored as repository secrets, then publishes the output (never key material)
# to the deploy-results branch. Run manually from the Actions tab.
name: deploy-devnet
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    env:
      DEPLOYER_B64: ${{ secrets.HS_DEPLOYER_KEYPAIR }}
      PROGRAM_B64: ${{ secrets.HS_PROGRAM_KEYPAIR }}
      REX_B64: ${{ secrets.HS_REX_KEYPAIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: deploy
        shell: bash
        continue-on-error: true
        run: |
          set +e
          exec > >(tee deploy.log) 2>&1
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh -o install.sh
          bash install.sh < /dev/null > /dev/null 2>&1
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          rialoman install stable@0.18.1 > /dev/null 2>&1; rialoman use stable@0.18.1 > /dev/null 2>&1
          export PATH="$(dirname "$(rialoman which rialo)"):$PATH"
          rialo --version
          mkdir -p keys
          printf '%s' "$DEPLOYER_B64" | base64 -d > keys/deployer.keypair
          printf '%s' "$PROGRAM_B64" | base64 -d > keys/program.keypair
          printf '%s' "$REX_B64" | base64 -d > keys/rex.keypair
          chmod 600 keys/*
          echo "== addresses (expected: deployer G839F16y..., program 5umz6vh9..., rex 7pycwurx...)"
          for k in deployer program rex; do
            echo "$k: $(rialo keytool address --keypair keys/$k.keypair --no-setup 2>&1 | tail -1)"
          done
          rialo keytool attach hs-deployer keys/deployer.keypair --no-setup 2>&1 | tail -2
          echo "== fund the deployer to at least 3 RLO"
          for i in 1 2 3 4 5 6; do
            b="$(rialo -n devnet -a hs-deployer client balance --no-setup 2>&1 | tail -1)"
            echo "balance: $b"
            num="$(echo "$b" | awk '{print $1}')"
            if awk "BEGIN{exit !(($num+0) >= 3.0)}"; then break; fi
            rialo -n devnet -a hs-deployer client airdrop --amount 1 --no-setup 2>&1 | tail -2
            sleep 3
          done
          echo "rustc in repo: $(rustc --version)"
          echo "== generate WIT and manifest"
          cargo check --manifest-path program/Cargo.toml 2>&1 | tail -2
          echo "== build artifact"
          cargo build --manifest-path program/artifact/Cargo.toml 2>&1 | tail -3
          echo "== deploy-venus"
          rialo -n devnet -a hs-deployer client program deploy-venus program \
            --keypair keys/program.keypair --rex-keypair keys/rex.keypair --no-setup 2>&1 | tail -30
          echo "== balance after deploy"
          rialo -n devnet -a hs-deployer client balance --no-setup 2>&1 | tail -1
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID"; echo "job-status: ${{ job.status }}"
            echo; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' deploy.log | tail -n 200
          } > /tmp/report/deploy-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b deploy-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add deploy-result.txt; git commit -q -m "deploy output for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-results
