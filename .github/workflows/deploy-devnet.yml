# Deploys Handshake to Rialo devnet from a Linux runner using persistent keys
# stored as repository secrets, then publishes the output (never key material)
# to the deploy-results branch. Run manually from the Actions tab.
name: deploy-devnet
on: workflow_dispatch
permissions:
  contents: read
# One devnet job at a time: they share one deployer key.
concurrency:
  group: devnet
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.90.0
          targets: wasm32-wasip2
      - name: deploy
        shell: bash
        # The keys are exposed to this step only, not to the actions above.
        env:
          DEPLOYER_B64: ${{ secrets.HS_DEPLOYER_KEYPAIR }}
          PROGRAM_B64: ${{ secrets.HS_PROGRAM_KEYPAIR }}
          REX_B64: ${{ secrets.HS_REX_KEYPAIR }}
        run: |
          # Not strict on purpose: Rialo's installer exits non-zero even when it
          # works. Every step that matters is checked explicitly below.
          set +e
          exec > >(tee deploy.log) 2>&1
          # Rialo publishes no checksum for its installer; it is fetched from the
          # official artifact bucket and runs only on manual dispatch.
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh -o install.sh
          bash install.sh < /dev/null > /dev/null 2>&1
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          rialoman install stable@0.18.1 > /dev/null 2>&1; rialoman use stable@0.18.1 > /dev/null 2>&1
          RIALO_BIN="$(rialoman which rialo 2>/dev/null)"
          [ -n "$RIALO_BIN" ] || { echo "DEPLOY ABORTED: the rialo toolchain did not install"; exit 1; }
          export PATH="$(dirname "$RIALO_BIN"):$PATH"
          rialo --version
          rialo --version | grep -q "0.18.1" || { echo "DEPLOY ABORTED: unexpected rialo version"; exit 1; }
          mkdir -p keys
          printf '%s' "$DEPLOYER_B64" | base64 -d > keys/deployer.keypair
          printf '%s' "$PROGRAM_B64" | base64 -d > keys/program.keypair
          printf '%s' "$REX_B64" | base64 -d > keys/rex.keypair
          chmod 600 keys/*
          echo "== the stored keys must load to the pinned addresses"
          check_key() {
            got="$(rialo keytool address --keypair "keys/$1.keypair" --no-setup 2>&1 | tail -1)"
            if [ "$got" = "$2" ]; then echo "$1: $got (expected)"; else echo "$1: $got does NOT match $2"; KEYFAIL=1; fi
          }
          KEYFAIL=0
          check_key deployer G839F16yx2AyBcQvcX2NoVRmq3U8R5xAAfbn1ngdhDP6
          check_key program 5umz6vh9vQ85fJhYrUmDMm6pGYVj5Cr5Tv9RS9GfEf2h
          check_key rex 7pycwurxgfQMaTN9KMbHqn8vCcBzgZhJKvB4epLyjpH3
          if [ "$KEYFAIL" = "1" ]; then echo "DEPLOY ABORTED: wrong keys"; exit 1; fi
          rialo keytool attach hs-deployer keys/deployer.keypair --no-setup 2>&1 | tail -2
          echo "== fund the deployer to at least 3 RLO"
          for i in 1 2 3 4 5 6; do
            b="$(rialo -n devnet -a hs-deployer client balance --no-setup 2>&1 | tail -1)"
            echo "balance: $b"
            num="$(echo "$b" | awk '{print $1}')"
            if awk "BEGIN{exit !(($num+0) >= 3.0)}"; then break; fi
            rialo -n devnet -a hs-deployer client airdrop --amount 1 --no-setup 2>&1 | tail -2
            sleep 3
          done
          echo "rustc in repo: $(rustc --version)"
          echo "== generate WIT and manifest"
          cargo check --manifest-path program/Cargo.toml > check.log 2>&1 \
            || { tail -20 check.log; echo "DEPLOY ABORTED: type-check failed"; exit 1; }
          tail -2 check.log
          echo "== build artifact"
          cargo build --manifest-path program/artifact/Cargo.toml > build.log 2>&1 \
            || { tail -30 build.log; echo "DEPLOY ABORTED: artifact build failed"; exit 1; }
          tail -3 build.log
          echo "== deploy-venus"
          DEPLOY_OUT="$(rialo -n devnet -a hs-deployer client program deploy-venus program \
            --keypair keys/program.keypair --rex-keypair keys/rex.keypair --no-setup 2>&1 | tail -30)"
          echo "$DEPLOY_OUT"
          echo "== balance after deploy"
          rialo -n devnet -a hs-deployer client balance --no-setup 2>&1 | tail -1
          echo "$DEPLOY_OUT" | grep -q "Venus program deployed at 5umz6vh9vQ85fJhYrUmDMm6pGYVj5Cr5Tv9RS9GfEf2h" \
            && echo "$DEPLOY_OUT" | grep -q "REX components deployed at 7pycwurxgfQMaTN9KMbHqn8vCcBzgZhJKvB4epLyjpH3" \
            || { echo "DEPLOY FAILED: expected program and REX addresses not reported"; exit 1; }
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID"; echo "job-status: ${{ job.status }}"
            echo; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' deploy.log | tail -n 200
          } > /tmp/report/deploy-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b deploy-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add deploy-result.txt; git commit -q -m "deploy output for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-results
