# Smoke-deploys Handshake to Rialo devnet from a Linux runner using a
# throwaway CI key, then publishes the output (never key material) to the
# deploy-results branch. Run manually from the Actions tab.
name: deploy-devnet
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: deploy
        shell: bash
        continue-on-error: true
        run: |
          set +e
          exec > >(tee deploy.log) 2>&1
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh -o install.sh
          bash install.sh < /dev/null
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          rialoman install stable@0.18.1 && rialoman use stable@0.18.1
          export PATH="$(dirname "$(rialoman which rialo)"):$PATH"
          rialo --version
          echo "== devnet health"
          curl -s -m 10 -X POST -H 'content-type: application/json' https://devnet.rialo.io -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'; echo
          echo "== key"
          rialo keytool generate ci --no-setup
          ADDR="$(rialo keytool address --alias ci --no-setup 2>&1 | tail -1)"
          echo "deployer address: $ADDR"
          echo "== airdrops (faucet gives about 1 RLO each)"
          for i in 1 2 3; do
            rialo -n devnet -a ci client airdrop --amount 1 --no-setup 2>&1 | tail -4
            sleep 3
          done
          rialo -n devnet -a ci client balance --no-setup 2>&1 | tail -3
          echo "== diagnose airdrop if the balance is empty"
          rialo -n devnet doctor airdrop 2>&1 | tail -15
          echo "== generate WIT and manifest"
          cargo check --manifest-path program/Cargo.toml 2>&1 | tail -3
          ls program/wit
          echo "== build artifact"
          cargo build --manifest-path program/artifact/Cargo.toml 2>&1 | tail -6
          echo "== deploy-venus"
          rialo -n devnet -a ci client program deploy-venus program --no-setup 2>&1 | tail -40
          echo "== balance after deploy"
          rialo -n devnet -a ci client balance --no-setup 2>&1 | tail -3
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID"; echo "job-status: ${{ job.status }}"
            echo; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' deploy.log | tail -n 400
          } > /tmp/report/deploy-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b deploy-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add deploy-result.txt; git commit -q -m "deploy output for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-results
