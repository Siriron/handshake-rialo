# Live scenarios against the deployed program on Rialo devnet:
#   A  pull-request verifier: a merged PR pays, a closed-unmerged PR refunds
#   B  early approval by the buyer pays immediately
#   C  adversarial calls: the seller tries to approve the buyer's milestone and
#      the buyer tries to re-create a funded deal. Both must fail on chain and
#      the deal must still settle exactly once. (Handlers are not exposed by the
#      CLI manifest, so direct handler calls cannot be tried from here.)
# Output (never keys) goes to the scenario-results branch.
name: test-scenarios
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    env:
      DEPLOYER_B64: ${{ secrets.HS_DEPLOYER_KEYPAIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: scenarios
        shell: bash
        continue-on-error: true
        run: |
          set +e
          exec > >(tee scen.log) 2>&1
          PROGRAM=5umz6vh9vQ85fJhYrUmDMm6pGYVj5Cr5Tv9RS9GfEf2h
          REX=7pycwurxgfQMaTN9KMbHqn8vCcBzgZhJKvB4epLyjpH3
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh -o install.sh
          bash install.sh < /dev/null > /dev/null 2>&1
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          rialoman install stable@0.18.1 > /dev/null 2>&1; rialoman use stable@0.18.1 > /dev/null 2>&1
          export PATH="$(dirname "$(rialoman which rialo)"):$PATH"
          mkdir -p keys
          printf '%s' "$DEPLOYER_B64" | base64 -d > keys/deployer.keypair; chmod 600 keys/*
          rialo keytool attach hs-deployer keys/deployer.keypair --no-setup 2>&1 | tail -1
          addr() { grep -o 'public key: [A-Za-z0-9]*' "$1" | awk '{print $3}'; }
          for a in sa sb sc; do rialo keytool generate "hs-$a" --no-setup > "$a.out" 2>&1; done
          SA="$(addr sa.out)"; SB="$(addr sb.out)"; SC="$(addr sc.out)"
          BUYER="$(rialo keytool address --alias hs-deployer --no-setup 2>&1 | tail -1)"
          echo "buyer=$BUYER"; echo "seller A=$SA B=$SB C=$SC"
          bal() { rialo -n devnet client balance "$1" --no-setup 2>&1 | tail -1 | awk '{print $1}'; }
          inv() { who="$1"; shift; echo "-- [$who] invoke $*"; out="$(rialo -n devnet -a "$who" client program invoke "$PROGRAM" --program-dir program "$@" --no-setup 2>&1 | tail -12)"; echo "$out"; LAST_SIG="$(echo "$out" | grep -o 'Transaction: [A-Za-z0-9]*' | awk '{print $2}' | tail -1)"; }
          status_of() { sleep 6; rialo -n devnet client transaction "$1" --no-setup 2>&1 | grep -E "Status:|No workflow|Already in a workflow" | cut -c1-170; }
          now() { date +%s%3N; }
          echo "== top up the buyer to 2.5 RLO, fund seller C as a signer (1 RLO)"
          for i in 1 2 3 4 5 6; do
            b="$(bal "$BUYER")"; echo "buyer balance: $b"
            if awk "BEGIN{exit !(($b+0) >= 2.5)}"; then break; fi
            rialo -n devnet -a hs-deployer client airdrop --amount 1 --no-setup 2>&1 | tail -1; sleep 3
          done
          rialo -n devnet -a hs-sc client airdrop --amount 1 --no-setup 2>&1 | tail -1
          echo "== manifest"; cargo check --manifest-path program/Cargo.toml 2>&1 | tail -1
          SLUG_A="$(openssl rand -hex 32)"; SLUG_B="$(openssl rand -hex 32)"; SLUG_C="$(openssl rand -hex 32)"
          SA0="$(bal "$SA")"; SB0="$(bal "$SB")"

          echo; echo "######## A: pull-request verifier"
          inv hs-deployer --function create --rex-bytecode-account "$REX" --arg workflow_pda_slug="$SLUG_A" --arg payee="$SA"
          DA1=$(( $(now) + 100000 )); DA2=$(( DA1 + 70000 ))
          inv hs-deployer --function add_milestone --arg workflow_pda_slug="$SLUG_A" --arg amount_kelvin=50000000 --arg deadline_ms=$DA1 --arg kind=2 --arg target='cli/cli#1'
          inv hs-deployer --function add_milestone --arg workflow_pda_slug="$SLUG_A" --arg amount_kelvin=50000000 --arg deadline_ms=$DA2 --arg kind=2 --arg target='cli/cli#7'
          inv hs-deployer --function fund --arg workflow_pda_slug="$SLUG_A"

          echo; echo "######## B: early approval"
          inv hs-deployer --function create --rex-bytecode-account "$REX" --arg workflow_pda_slug="$SLUG_B" --arg payee="$SB"
          DB=$(( $(now) + 900000 ))
          inv hs-deployer --function add_milestone --arg workflow_pda_slug="$SLUG_B" --arg amount_kelvin=30000000 --arg deadline_ms=$DB --arg kind=1 --arg target='Siriron/handshake-rialo@v9.9.9'
          inv hs-deployer --function fund --arg workflow_pda_slug="$SLUG_B"
          inv hs-deployer --function approve --arg workflow_pda_slug="$SLUG_B" --arg index=0

          echo; echo "######## C: adversarial calls"
          inv hs-deployer --function create --rex-bytecode-account "$REX" --arg workflow_pda_slug="$SLUG_C" --arg payee="$SC"
          DC=$(( $(now) + 110000 ))
          inv hs-deployer --function add_milestone --arg workflow_pda_slug="$SLUG_C" --arg amount_kelvin=40000000 --arg deadline_ms=$DC --arg kind=1 --arg target='Siriron/handshake-rialo@v0.1.0'
          inv hs-deployer --function fund --arg workflow_pda_slug="$SLUG_C"
          SC1="$(bal "$SC")"; echo "seller C balance before attacks: $SC1"
          echo "-- C1: the seller tries to approve the buyer's milestone"
          inv hs-sc --function approve --arg workflow_pda_slug="$SLUG_C" --arg index=0
          C1_SIG="$LAST_SIG"; C1_STATUS="$(status_of "$C1_SIG")"; echo "C1 on-chain ($C1_SIG):"; echo "$C1_STATUS"
          echo "-- C3: the buyer tries to re-create the funded deal with the same slug"
          inv hs-deployer --function create --rex-bytecode-account "$REX" --arg workflow_pda_slug="$SLUG_C" --arg payee="$SC"
          C3_SIG="$LAST_SIG"; C3_STATUS="$(status_of "$C3_SIG")"; echo "C3 on-chain ($C3_SIG):"; echo "$C3_STATUS"

          END=$(( DA2 + 150000 ))
          echo; echo "== waiting for deadlines and checks"
          while [ "$(now)" -lt "$END" ]; do
            echo "t=$(date +%H:%M:%S) A=$(bal "$SA") B=$(bal "$SB") C=$(bal "$SC")"
            sleep 30
          done
          SAF="$(bal "$SA")"; SBF="$(bal "$SB")"; SCF="$(bal "$SC")"
          within() { awk "BEGIN{d=$1-$2; exit !(d>=$3 && d<=$4)}"; }
          echo; echo "==================== SUMMARY"
          within "$SAF" "$SA0" 0.0499 0.0501 && echo "RESULT A pull-request verifier: PASS (seller +$SAF; merged PR paid, unmerged PR refunded)" || echo "RESULT A pull-request verifier: FAIL (seller $SA0 -> $SAF, expected +0.05)"
          within "$SBF" "$SB0" 0.0299 0.0301 && echo "RESULT B early approval: PASS (seller +$SBF)" || echo "RESULT B early approval: FAIL (seller $SB0 -> $SBF, expected +0.03)"
          echo "$C1_STATUS" | grep -q "Failed" && echo "RESULT C1 seller cannot approve the buyer's deal: PASS (tx $C1_SIG failed on chain)" || echo "RESULT C1 seller cannot approve the buyer's deal: FAIL (status: $C1_STATUS)"
          echo "$C3_STATUS" | grep -q "Failed" && echo "RESULT C3 buyer cannot re-create a funded deal: PASS (tx $C3_SIG failed on chain)" || echo "RESULT C3 buyer cannot re-create a funded deal: FAIL (status: $C3_STATUS)"
          within "$SCF" "$SC1" 0.0299 0.0401 && echo "RESULT C deal still settled once after attacks: PASS (seller $SC1 -> $SCF, expected about +0.04)" || echo "RESULT C deal still settled once after attacks: FAIL (seller $SC1 -> $SCF)"
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID"; echo "job-status: ${{ job.status }}"
            echo; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' scen.log | sed -n '/==================== SUMMARY/,$p'
            echo; echo "---------------- full log"; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' scen.log | tail -n 330
          } > /tmp/report/scenario-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b scenario-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add scenario-result.txt; git commit -q -m "scenario output for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scenario-results
