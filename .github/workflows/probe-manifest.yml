# Dumps the Venus-generated manifest and WIT (instruction tags, account lists,
# PDA derivations) so the web client can be checked against them. No devnet
# access and no secrets. Output goes to the manifest-results branch.
name: probe-manifest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.90.0
          targets: wasm32-wasip2
      - name: generate
        shell: bash
        run: |
          mkdir -p /tmp/report
          cargo check --manifest-path program/Cargo.toml > /tmp/report/check.log 2>&1; tail -3 /tmp/report/check.log
          cp program/wit/* /tmp/report/ 2>&1 | tail -2
          ls -la /tmp/report
      - name: publish output
        if: always()
        shell: bash
        run: |
          cd /tmp/report
          git init -q; git checkout -q -b manifest-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          echo "commit: $GITHUB_SHA run: $GITHUB_RUN_ID" > run.txt
          git add -A; git commit -q -m "manifest for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" manifest-results
