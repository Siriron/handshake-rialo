# Prints the full status and logs of specific devnet transactions.
name: tx-status
on:
  workflow_dispatch:
    inputs:
      signatures:
        description: "Space-separated transaction signatures"
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    steps:
      - name: status
        shell: bash
        continue-on-error: true
        env:
          SIGS: ${{ github.event.inputs.signatures }}
        run: |
          set +e
          exec > >(tee tx.log) 2>&1
          curl -fsSL https://rialo-artifacts.s3.us-east-2.amazonaws.com/rialoman/stable/install.sh -o install.sh
          bash install.sh < /dev/null > /dev/null 2>&1
          export PATH="$HOME/.local/share/rialo/bin:$PATH"
          rialoman install stable@0.18.1 > /dev/null 2>&1; rialoman use stable@0.18.1 > /dev/null 2>&1
          export PATH="$(dirname "$(rialoman which rialo)"):$PATH"
          for sig in $SIGS; do
            echo "=================== $sig"
            rialo -n devnet client transaction "$sig" --no-setup 2>&1 | grep -v '^\s*$' | head -40 | cut -c1-220
          done
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          { echo "run: $GITHUB_RUN_ID"; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' tx.log | head -n 300; } > /tmp/report/tx-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b tx-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add tx-result.txt; git commit -q -m "tx status $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tx-results
