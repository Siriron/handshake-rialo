name: ci
on:
  push:
    branches-ignore: [ci-results]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the report step, and only on push events
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: prepare logs
        shell: bash
        run: touch core-test.log program-check.log
      - name: core tests
        shell: bash
        run: cargo test --manifest-path core/Cargo.toml 2>&1 | tee core-test.log
      - name: program type-check
        shell: bash
        run: cargo check --manifest-path program/Cargo.toml 2>&1 | tee program-check.log
      - name: publish result to the ci-results branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/report
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "job-status: ${{ job.status }}"
            echo; echo "--- core tests (tail)"; tail -n 40 core-test.log || true
            echo; echo "--- program check (tail)"; tail -n 30 program-check.log || true
          } > /tmp/report/ci-result.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-results
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ci-result.txt
          git commit -q -m "ci result for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
