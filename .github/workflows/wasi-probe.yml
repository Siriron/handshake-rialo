# Builds the generated REX component with several Rust versions and records
# which WASI version each one imports, to find a toolchain the validators can
# instantiate. Output goes to the wasi-results branch.
name: wasi-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the output branch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: probe
        shell: bash
        continue-on-error: true
        run: |
          set +e
          exec > >(tee wasi.log) 2>&1
          echo "default stable: $(rustc --version)"
          cargo check --manifest-path program/Cargo.toml 2>&1 | tail -1
          CRATE="$(dirname "$(find program/target/rex-wasm-components -maxdepth 2 -name Cargo.toml | head -1)")"
          echo "rex crate: $CRATE"
          for v in 1.86.0 1.88.0 1.90.0 1.92.0 1.94.0 1.96.0 1.98.0 stable; do
            echo "== rust $v"
            rustup toolchain install "$v" --profile minimal -t wasm32-wasip2 > /dev/null 2>&1 || { echo "install failed"; continue; }
            rm -rf "$CRATE/target"
            if cargo +"$v" build --release --target wasm32-wasip2 --manifest-path "$CRATE/Cargo.toml" > build.out 2>&1; then
              W="$(find "$CRATE/target" -name '*.wasm' -path '*release*' -not -path '*deps*' | head -1)"
              [ -z "$W" ] && W="$(find "$CRATE/target" -name '*.wasm' -path '*release*' | head -1)"
              echo "built: $(basename "$W") $(wc -c < "$W") bytes ($(rustc +"$v" --version))"
              grep -a -o 'wasi:[a-z-]*/[a-z0-9-]*@[0-9.]*' "$W" | sort -u | tr '\n' ' '; echo
            else
              echo "build failed: $(tail -3 build.out | tr '\n' ' ' | cut -c1-240)"
            fi
          done
      - name: publish output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/report
          { echo "run: $GITHUB_RUN_ID"; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' wasi.log | tail -n 150; } > /tmp/report/wasi-result.txt
          cd /tmp/report
          git init -q; git checkout -q -b wasi-results
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add wasi-result.txt; git commit -q -m "wasi probe $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wasi-results
